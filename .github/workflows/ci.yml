name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: registry.fedoraproject.org/fedora:44
      # tini as pid 1 reaps orphans; without it dead children stay zombies and look alive.
      options: --init
    steps:
      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc clang rustup pam-devel wayland-devel libxkbcommon-devel \
            pango-devel cairo-devel cairo-gobject-devel glib2-devel \
            mesa-libEGL-devel mesa-dri-drivers mesa-libgbm-devel \
            sway wtype grim python3 scdoc procps-ng libcap dejavu-sans-fonts liberation-sans-fonts swaybg \
            dbus-daemon python3-dbus python3-gobject \
            python3-pytest python3-pytest-xdist python3-pytest-timeout
          # Fedora ships sway with cap_sys_nice; the CI container may not grant it, so exec fails
          # with EPERM. The tests do not need realtime scheduling.
          setcap -r /usr/bin/sway
          rustup-init -y --default-toolchain stable --profile minimal -c clippy
          ~/.cargo/bin/rustup toolchain install nightly --profile minimal -c rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Fast gate
        run: contrib/gate --fast
      - name: Slow gate
        env:
          E2E_JOBS: "4"
        run: contrib/gate --slow
