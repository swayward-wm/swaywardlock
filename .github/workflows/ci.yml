name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc clang rustup pam-devel wayland-devel libxkbcommon-devel \
            pango-devel cairo-devel cairo-gobject-devel glib2-devel \
            mesa-libEGL-devel mesa-dri-drivers mesa-libgbm-devel \
            sway wtype grim python3 procps-ng libcap dejavu-sans-fonts swaybg \
            dbus-daemon python3-dbus python3-gobject
          # Fedora ships sway with cap_sys_nice; the CI container may not grant it, so exec fails
          # with EPERM. The tests do not need realtime scheduling.
          setcap -r /usr/bin/sway
          rustup-init -y --default-toolchain stable --profile minimal -c clippy
          ~/.cargo/bin/rustup toolchain install nightly --profile minimal -c rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: fmt
        run: cargo +nightly fmt --check
      - name: clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features test-auth -- -D warnings
      - name: test
        run: cargo test
      - name: swaylock-to-kdl
        run: |
          cargo build --features test-auth
          SWAYWARDLOCK=target/debug/swaywardlock python3 contrib/test-swaylock-to-kdl.py
      - name: e2e (headless sway)
        timeout-minutes: 5
        run: contrib/e2e-sway target/debug/swaywardlock
      - name: release has no test-auth
        run: |
          cargo build --release
          ! grep -q swaywardlock-test target/release/swaywardlock
