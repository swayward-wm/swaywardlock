[package]
name = "swaywardlock"
version = "26.10.0-beta.1"
description = "Screen locker for the swayward-wm family"
authors = ["Martin Trojer"]
license = "GPL-3.0-or-later"
edition = "2021"
repository = "https://github.com/swayward-wm/swaywardlock"
rust-version = "1.87"

[dependencies]
anyhow = "1.0"
calloop = { version = "0.14", features = ["signals"] }
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
csscolorparser = "0.9"
fastrand = "2"
glam = "0.33"
keyframe = { version = "1.1.1", default-features = false }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
# JPEG XL (Fedora's stock wallpaper format), pure Rust, through the image crate's decoder hook.
jxl-oxide = { version = "0.12", default-features = false, features = ["image"] }
knuffel = "3.2.0"
libc = "0.2"
miette = { version = "5.10.0", features = ["fancy-no-backtrace"] }
pango = { version = "0.21.5", features = ["v1_44"] }
pangocairo = "0.21.5"
pam-sys2 = "1.0.2"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-egl = "0.32"
xkbcommon = { version = "0.9", default-features = false }
zeroize = "1.8"

[dependencies.smithay]
# Same rev as swayward's workspace pin, so code copied from swayward builds unchanged.
git = "https://github.com/Smithay/smithay.git"
rev = "0c05927e154463a9973ad3741bef793489c92b3f"
default-features = false
features = ["backend_winit", "renderer_gl"]

[dev-dependencies]
tempfile = "3"

[features]
# Replaces PAM with a fixed test password. Never enabled in release builds.
test-auth = []

[profile.release]
panic = "abort"
lto = "thin"

[profile.dev]
panic = "abort"
